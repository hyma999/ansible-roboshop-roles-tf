- ansible.builtin.import_role:
    name: common
    tasks_from: app-setup.yaml
  name: app setup


- ansible.builtin.import_role:
    name: common
    tasks_from: nodejs-setup.yaml
  name: nodejs setup


- ansible.builtin.import_role:
    name: common
    tasks_from: systemd-setup.yaml
  name: systemd setup


- ansible.builtin.service:
    enabled: yes
    name: cart
    state: restarted

  name: start cart